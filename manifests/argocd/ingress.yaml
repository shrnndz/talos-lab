apiVersion: v1
kind: Service
metadata:
  name: argocd-server-h2c
  namespace: argocd
spec:
  ports:
    - name: grpc
      port: 80
      targetPort: 8080
      appProtocol: kubernetes.io/h2c
  selector:
    app.kubernetes.io/name: argocd-server

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: tint.cercado.io
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      hostname: argocd.cercado.io
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argo-tls
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: argocd
      sectionName: websecure
  hostnames:
    - argocd.cercado.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: content-type
              value: application/grpc
      backendRefs:
        - name: argocd-server-h2c
          port: 80
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-tls
  namespace: argocd
spec:
  dnsNames:
    - argocd.cercado.io
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-issuer
  secretName: argo-tls
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.cercado.io
  oidc.config: |
    name: Keycloak
    issuer: https://auth.cercado.io/realms/hernanfam
    clientID: argocd
    enablePKCEAuthentication: true
    refreshTokenThreshold: 2m
    requestedScopes: ["openid", "profile", "email", "groups"]
  policy.csv: |
    g, argocd-admins, role:admin

apiVersion: v1
kind: Namespace
metadata:
  name: hoas

---
apiVersion: v1
kind: Service
metadata:
  name: hoas
  namespace: hoas
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8123
      targetPort: 8123

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hoas-1
  namespace: hoas
  labels:
    kubernetes.io/service-name: hoas
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - "192.168.20.77"
    conditions:
      ready: true

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hoas-tls
  namespace: hoas
spec:
  secretName: hoas-tls
  dnsNames:
    - hoas.hernanfam.com
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hoas
  namespace: hoas
  annotations:
    external-dns.alpha.kubernetes.io/target: tint.hernanfam.com
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      hostname: hoas.hernanfam.com
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hoas-tls
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hoas
  namespace: hoas
spec:
  parentRefs:
    - name: hoas
      sectionName: websecure
  hostnames:
    - hoas.hernanfam.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hoas
          port: 8123

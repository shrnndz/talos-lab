apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-external-secrets
  namespace: traefik
automountServiceAccountToken: false

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-traefik
  namespace: traefik
spec:
  provider:
    vault:
      server: https://bao.cercado.io
      path: traefik
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: traefik-external-secrets
          serviceAccountRef:
            name: traefik-external-secrets
            audiences:
              - openbao

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-openobserve-otlp
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-traefik
    kind: SecretStore
  target:
    name: traefik-openobserve-otlp
    # Orphan permits migration from the temporary manually-created Secret
    # and prevents deleting the credential if this manifest is removed.
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: OPENOBSERVE_OTLP_AUTHORIZATION
      remoteRef:
        key: config
        property: authorization

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-internal
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - 192.168.20.0/24

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: traefik
spec:
  secretName: traefik-dashboard-tls
  dnsNames:
    - tint.hernanfam.com
    - tint.cercado.io
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
    group: cert-manager.io
